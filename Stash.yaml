  Subscribe7:
    url: http://your-service-provider-7 # 订阅链接 7，用你的订阅链接替换
    interval: 86400
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 5
  Subscribe8:
    url: http://your-service-provider-8 # 订阅链接 8，用你的订阅链接替换
    interval: 86400
    benchmark-url: http://www.gstatic.com/generate_204
