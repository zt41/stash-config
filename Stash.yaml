# Stash 懒人配置
# 规则集: https://github.com/QuixoticHeart/rule-set (ruleset 分支 stash 目录, 每日自动构建)
# 自定义规则: Emby / EmbyDirect / Nintendo -> https://github.com/zt41/emby-rules
# 骨架参考: Coldvvater/Mononoke
# Update Date: 2026-11-04

# 通用设置
mode: rule
log-level: info

# DNS模块
dns:
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"

# 服务提供商（已配置十个订阅位，按需替换 url 即可；更多订阅就复制一段改名 Subscribe11，并在各分组的 use 里加上）
proxy-providers:
  Subscribe:
    url: http://your-service-provider # 订阅链接 1，用你的订阅链接替换
    interval: 86400
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 5
  Subscribe2:
    url: http://your-service-provider-2 # 订阅链接 2，用你的订阅链接替换
    interval: 86400
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 5
