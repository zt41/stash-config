# 规则引用（顺序即优先级，越靠上越先匹配）
rules:
  # 自定义规则
  - RULE-SET,private,DIRECT
  - RULE-SET,EmbyDirect,直连emby
  - RULE-SET,Emby,Emby
  - RULE-SET,Nintendo,Nintendo
  # 广告与屏蔽
  - RULE-SET,httpdns,REJECT
  - RULE-SET,adrules,AdBlock
  # AI 与流媒体
  - RULE-SET,ai,AI
  - RULE-SET,youtube,YouTube
  - RULE-SET,netflix,NETFLIX
  - RULE-SET,disney,Disney+
  - RULE-SET,tiktok,TikTok
  - RULE-SET,douyin,DIRECT
  - RULE-SET,bilibili,bilibili
  - RULE-SET,abema,Streaming
  - RULE-SET,bahamut,Streaming
  - RULE-SET,hbo,Streaming
  - RULE-SET,hulu,Streaming
  - RULE-SET,primevideo,Streaming
  - RULE-SET,dazn,Streaming
  - RULE-SET,niconico,Streaming
  - RULE-SET,twitch,Streaming
  - RULE-SET,mytvsuper,Streaming
  - RULE-SET,dmm,Streaming
  - RULE-SET,spotify,Spotify
  # 游戏
  - RULE-SET,games-cn,DIRECT
  - RULE-SET,games,Games
  # 社交与论坛
  - RULE-SET,socialmedia-cn,DIRECT
  - RULE-SET,socialmedia,SocialMedia
  - RULE-SET,forum,Proxy
  # 电商、支付、加密货币、网络电话
  - RULE-SET,ecommerce,Proxy
  - RULE-SET,paypal,Proxy
  - RULE-SET,crypto,Proxy
  - RULE-SET,talkatone,Proxy
  # DMCA 敏感流量直连，防止机场审计
  - RULE-SET,dmca,DIRECT
  # 开发与平台服务
  - RULE-SET,gits,GitHub
  - RULE-SET,apns,DIRECT
  - RULE-SET,apple-tv,Proxy
  - RULE-SET,apple-proxy,Proxy
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,apple,Apple
  - RULE-SET,googlefcm,Google
  - RULE-SET,google,Google
  - RULE-SET,onedrive,Microsoft
  - RULE-SET,microsoft-cn,DIRECT
  - RULE-SET,microsoft,Microsoft
  # CDN 与测速直连
  - RULE-SET,cdn,DIRECT
  - RULE-SET,speedtest,DIRECT
  # 兜底代理
  - RULE-SET,tld-proxy,Proxy
  - RULE-SET,proxy,Proxy
  - RULE-SET,gfw,Proxy
  # 国内直连
  - RULE-SET,cn,DIRECT
  - RULE-SET,cncidr,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Final

